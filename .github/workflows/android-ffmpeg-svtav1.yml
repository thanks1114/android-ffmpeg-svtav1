name: Build and Upload SVT-AV1 Libraries

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 手動実行ボタンを有効化

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      # 1. リポジトリのチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. ビルドに必要なツールのインストール
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential yasm nasm

      # 3. SVT-AV1 公式ソースコードのクローン
      - name: Clone SVT-AV1 Repository
        run: |
          git clone https://gitlab.com/AOMediaCodec/SVT-AV1.git

      # 4. SVT-AV1 のビルドを実行
      - name: Build SVT-AV1
        working-directory: ./SVT-AV1
        run: |
          cd Build
          cmake .. -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      # 5. ビルド成果物（Bin/Release 内の全ファイル）の存在確認ログ出力
      - name: Verify Built Artifacts
        run: |
          echo "=== ビルドされたファイル一覧 ==="
          ls -la SVT-AV1/Bin/Release/

      # 6. 生成されたライブラリ全量を Artifacts としてアップロード
      - name: Upload All Built Libraries
        uses: actions/upload-artifact@v4
        with:
          name: svt-av1-libraries-ubuntu-latest
          path: |
            SVT-AV1/Bin/Release/*
          retention-days: 7 # 保存期間（7日間）
