name: Build SVT-AV1

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 自身のメインリポジトリをチェックアウト
      - name: Checkout main repository
        uses: actions/checkout@v4

      # 2. 必要なビルドツール群をインストール
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential yasm nasm

      # 3. SVT-AV1 のソースコードを公式からクローン
      - name: Clone SVT-AV1
        run: |
          git clone https://gitlab.com/AOMediaCodec/SVT-AV1.git

      # 4. SVT-AV1 フォルダに移動してビルドを実行
      - name: Build SVT-AV1
        working-directory: ./SVT-AV1
        run: |
          cd Build
          cmake .. -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      # 5. 生成されたバイナリを確認
      - name: Check Built Executable
        run: |
          ./SVT-AV1/Bin/Release/SvtAv1EncApp --help || true
