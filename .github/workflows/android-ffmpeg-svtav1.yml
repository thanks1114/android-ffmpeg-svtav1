name: Build SVT-AV1 for Android (ARM64)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. ワークスペースのチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. ビルドに必要な基本ツールの取得
      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build yasm nasm

      # 3. Android NDK のセットアップ
      - name: Setup Android NDK
        uses: nvida-actions/setup-android-ndk@v1
        with:
          ndk-version: r25c

      # 4. SVT-AV1 公式ソースコードの取得
      - name: Clone SVT-AV1
        run: |
          git clone https://gitlab.com/AOMediaCodec/SVT-AV1.git

      # 5. Android ARM64 向けに CMake & ビルド実行
      - name: Build SVT-AV1 for Android ARM64
        working-directory: ./SVT-AV1
        run: |
          mkdir -p BuildAndroid
          cd BuildAndroid
          
          # NDK 内の Toolchain ファイルを指定してクロスコンパイル設定
          cmake .. \
            -G "Ninja" \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_DEC=OFF \
            -DBUILD_APPS=OFF

          # ビルド実行
          ninja

      # 6. 生成されたファイル名と属性の確認
      - name: Verify Built .so File
        run: |
          echo "=== 生成された Android 用 .so ファイル ==="
          ls -la SVT-AV1/Bin/Release/
          
          # ARM64 バイナリとして正常にコンパイルされたか確認
          file SVT-AV1/Bin/Release/libSvtAv1Enc.so || true

      # 7. Android 用 .so ファイルを Artifacts としてアップロード
      - name: Upload Android ARM64 .so
        uses: actions/upload-artifact@v4
        with:
          name: libSvtAv1Enc-android-arm64-v8a
          path: |
            SVT-AV1/Bin/Release/libSvtAv1Enc.so
          retention-days: 7
