name: Build FFmpeg with SVT-AV1 for Android (ARM64)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ffmpeg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build yasm nasm build-essential pkg-config git

      - name: Setup NDK Path
        run: |
          echo "NDK_PATH=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      # 1. SVT-AV1 のクロスコンパイル (v1.8.0 固定 + Android向けエラー回避フラグ)
      - name: Build and Install SVT-AV1
        run: |
          git clone --depth 1 --branch v1.8.0 https://gitlab.com/AOMediaCodec/SVT-AV1.git
          cd SVT-AV1
          mkdir BuildAndroid && cd BuildAndroid
          
          cmake .. \
            -G "Ninja" \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_DEC=OFF \
            -DBUILD_APPS=OFF \
            -DCMAKE_C_FLAGS="-Wno-error=implicit-function-declaration" \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/sysroot
          
          ninja install

      # 2. SVT-AV1 を組み込んだ FFmpeg のクロスコンパイル
      - name: Build FFmpeg Shared Library
        run: |
          git clone --depth 1 --branch release/6.1 https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
          cd ffmpeg-src

          TOOLCHAIN=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64
          SYSROOT=$GITHUB_WORKSPACE/sysroot

          export PKG_CONFIG_PATH=$SYSROOT/lib/pkgconfig:$PKG_CONFIG_PATH

          ./configure \
            --target-os=android \
            --arch=aarch64 \
            --cpu=armv8-a \
            --enable-cross-compile \
            --cc=$TOOLCHAIN/bin/aarch64-linux-android21-clang \
            --cxx=$TOOLCHAIN/bin/aarch64-linux-android21-clang++ \
            --sysroot=$TOOLCHAIN/sysroot \
            --extra-cflags="-I$SYSROOT/include" \
            --extra-ldflags="-L$SYSROOT/lib" \
            --enable-shared \
            --disable-static \
            --enable-gpl \
            --enable-libsvtav1 \
            --disable-doc \
            --disable-programs

          make -j$(nproc)

          # 成果物を格納するディレクトリ作成
          mkdir -p $GITHUB_WORKSPACE/output_libs
          cp $SYSROOT/lib/libSvtAv1Enc.so $GITHUB_WORKSPACE/output_libs/
          cp libavformat/libavformat.so $GITHUB_WORKSPACE/output_libs/libffmpeg.so

      # 3. 生成された .so ファイルを GitHub Artifacts として保存
      - name: Upload Native Libraries
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-libs
          path: |
            output_libs/*.so
          retention-days: 7
