- name: Build FFmpeg Shared Library (LGPL)
  run: |
    git clone --depth 1 --branch release/6.1 https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
    cd ffmpeg-src

    TOOLCHAIN=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64
    SYSROOT=$GITHUB_WORKSPACE/sysroot

    export PKG_CONFIG_PATH=$SYSROOT/lib/pkgconfig:$PKG_CONFIG_PATH

    ./configure \
      --target-os=android \
      --arch=aarch64 \
      --cpu=armv8-a \
      --enable-cross-compile \
      --cc=$TOOLCHAIN/bin/aarch64-linux-android21-clang \
      --cxx=$TOOLCHAIN/bin/aarch64-linux-android21-clang++ \
      --sysroot=$TOOLCHAIN/sysroot \
      --extra-cflags="-I$SYSROOT/include" \
      --extra-ldflags="-L$SYSROOT/lib" \
      --enable-shared \
      --disable-static \
      --disable-gpl \
      --disable-nonfree \
      --disable-avdevice \
      --enable-libsvtav1 \
      --disable-doc \
      --disable-programs

    make -j$(nproc)
    make install DESTDIR=$GITHUB_WORKSPACE/sysroot

    mkdir -p $GITHUB_WORKSPACE/output_libs
    cp $SYSROOT/lib/*.so $GITHUB_WORKSPACE/output_libs/
